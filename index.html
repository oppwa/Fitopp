<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaliFit</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc;-webkit-tap-highlight-color:transparent}
.cb{width:26px;height:26px;border:2px solid #475569;border-radius:7px;background:#1e293b;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.15s}
.cb.on{background:#84cc16;border-color:#84cc16;color:#0f172a;font-weight:700}
.ib{padding:4px 8px;border-radius:8px;font-size:13px;background:#1e293b;border:1px solid #334155}
.ib:hover{border-color:#84cc16}
input,select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px;width:100%;color:#fff;outline:none}
input:focus,select:focus{border-color:#84cc16}
</style>
</head>
<body class="min-h-screen pb-24">
<header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <h1 class="text-xl font-bold">⚡ Wali<span class="text-lime-500">Fit</span></h1>
    <div class="flex items-center gap-2">
      <span id="st" class="text-[11px] text-slate-400"></span><span id="dirty" class="hidden text-xs text-amber-400">● Sin guardar</span>
      <button onclick="A.save()" id="saveBtn" class="bg-lime-500 text-slate-900 font-bold text-sm px-4 py-2 rounded-lg">💾 Guardar</button>
      <button onclick="A.menu()" class="ib">⋯</button>
    </div>
  </div>
  <nav class="max-w-3xl mx-auto px-4 flex overflow-x-auto" id="tabs"></nav>
</header>
<main class="max-w-3xl mx-auto px-4 py-5" id="app"></main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/80 flex items-end sm:items-center justify-center p-4">
  <form id="mf" class="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm" onsubmit="return A.submit(event)">
    <h3 id="mt" class="font-bold mb-3"></h3><div id="mb" class="space-y-3"></div>
    <p id="me" class="text-red-400 text-xs mt-2 min-h-4"></p>
    <div class="flex gap-3 mt-3"><button type="button" onclick="A.close()" class="flex-1 py-2 rounded-lg border border-slate-600">Cancelar</button><button class="flex-1 py-2 rounded-lg bg-lime-500 text-slate-900 font-bold">Aceptar</button></div>
  </form>
</div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-lime-500 text-slate-900 font-semibold text-sm px-4 py-2 rounded-full z-50"></div>
<input type="file" id="imp" accept=".json" class="hidden">

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const FIREBASE_CONFIG={apiKey:"AIzaSyASSRUX3E-bQC4gxpARWchn07HFxTvaDoA",authDomain:"walifit.firebaseapp.com",projectId:"walifit",storageBucket:"walifit.firebasestorage.app",messagingSenderId:"1054547852328",appId:"1:1054547852328:web:33791121eb621ec368c91d"};
const CFG=typeof __firebase_config!=='undefined'?JSON.parse(__firebase_config):(FIREBASE_CONFIG.apiKey?FIREBASE_CONFIG:null);
const APPID=typeof __app_id!=='undefined'?__app_id:'wali-fit-app';
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],KEY='walifit_v2',GOAL=145,ORIG=['Comprado','De mi canchón','Regalo','Donado'],CATS=['Proteínas','Verduras y frutas','Abarrotes','Otros'];

const uid=()=>Math.random().toString(36).slice(2,9);

function def(){return{
 w:{Lunes:[W('Sentadilla con barra',4,15),W('Prensa',4,15),W('Extensión',3,15),W('Curl isquiotibiales',3,15),W('Crunch abdominal',3,15)],
  Martes:[W('Dominadas',4,15),W('Remo polea',4,15),W('Remo barra',3,15),W('Curl inclinado',3,15),W('Curl polea',3,15)],
  Miércoles:[W('Press banca',4,15),W('Aperturas',3,15),W('Press hombros',4,15),W('Elevaciones laterales',3,15),W('Extensión tríceps',4,15),W('Natación (30-40 min)',1,350)],
  Jueves:[W('Peso muerto',4,15),W('Zancadas',3,15),W('Elevación lateral',3,15),W('Crunch',3,15)],

  Jueves:[M('Desayuno','Batido yogur griego',25,300),M('Almuerzo','Estofado de pollo',40,550),M('Cena','Trucha + vainitas',35,380)],
  Viernes:[M('Desayuno','Huevos + fruta',20,300),M('Almuerzo','Pollo asado + arroz',45,650),M('Cena','Atún o sopa ligera',25,300)],
  Sábado:[M('Desayuno','Tortilla de huevos',20,300),M('Almuerzo','Libre',30,600),M('Cena','Libre',25,450)],
  Domingo:[M('Desayuno','Avena + fruta',10,300),M('Almuerzo','Libre',30,600),M('Cena','Ligera',20,350)]},h:{},pw:{},g:{ideal:0,start:0},wk:'',
 sh:[S('Huevos','Proteínas',2,'docena',0),S('Pechuga de pollo','Proteínas',1.5,'kg',0),S('Trucha (filetes)','Proteínas',2,'und',0),S('Atún','Proteínas',2,'latas',0),
  S('Espinaca','Verduras y frutas',1,'atado',0),S('Tomate','Verduras y frutas',1,'kg',0),S('Plátanos','Verduras y frutas',1,'mano',0),S('Palta','Verduras y frutas',3,'und',0),
  S('Lentejas','Abarrotes',1,'kg',0),S('Arroz','Abarrotes',1,'kg',0),S('Avena','Abarrotes',1,'bolsa',0),S('Fideos','Abarrotes',2,'paq',0)]}}
let saved,D,tab='r',cfg=null,docRef,today=dn(key()),sel=today;
function norm(j){j.h=j.h||{};j.pw=j.pw||{};j.g=j.g||{ideal:0,start:0};const m=mon(key());
 if(j.wk!==m){DAYS.forEach(d=>{(j.w[d]||[]).forEach(x=>x.c=x.c.map(()=>false));(j.m[d]||[]).forEach(x=>x.c=false)});(j.sh||[]).forEach(x=>x.b=false);j.wk=m}return j}
try{saved=localStorage.getItem(KEY)}catch(e){}
if(!saved)saved=JSON.stringify(def());
try{D=norm(JSON.parse(saved))}catch(e){D=norm(def())}
saved=JSON.stringify(D);try{localStorage.setItem(KEY,saved)}catch(e){}
const SV=()=>JSON.parse(saved);
const dirty=()=>JSON.stringify(D)!==saved;
const kW=(w,d)=>(w[d]||[]).reduce((a,x)=>a+x.c.filter(Boolean).length*x.k,0);

const pM=(m,d)=>(m[d]||[]).filter(x=>x.c).reduce((a,x)=>a+x.p,0);
const $=id=>document.getElementById(id);

function card(t,v,c){return `<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center"><p class="text-[11px] uppercase text-slate-400">${t}</p><p class="text-xl font-bold ${c}">${v}</p></div>`}

function render(){
  today=dn(key());
  $('tabs').innerHTML=[['r','📈 Progreso'],['w','🏋️ Entreno'],['m','🥗 Menú'],['s','🛒 Compras'],['p','⚖️ Peso'],['h','📅 Historial']].map(([k,l])=>`<button onclick="A.tab('${k}')" class="flex-1 shrink-0 px-3 py-2.5 text-sm font-semibold whitespace-nowrap border-b-2 ${tab===k?'border-lime-500 text-lime-400':'border-transparent text-slate-400'}">${l}</button>`).join('');
  const sv=SV();let h='';
  if(tab==='w'){
    const list=D.w[sel]||[];

    h+=list.length?list.map(x=>`<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-3"><div class="flex justify-between gap-2"><div><h4 class="font-semibold">${esc(x.n)}</h4><p class="text-xs text-slate-400">${x.s} serie(s) · +${x.k} kcal/serie</p></div><div class="flex gap-1 shrink-0"><button class="ib" onclick="A.editW('${x.id}')">✏️</button><button class="ib" onclick="A.del('w','${x.id}')">🗑</button></div></div><div class="flex gap-2 flex-wrap mt-2">${x.c.map((c,i)=>`<button onclick="A.ck('${x.id}',${i})" class="cb ${c?'on':''}">✓</button>`).join('')}</div></div>`).join(''):'<p class="text-center text-slate-500 py-8">Día libre. Añade un ejercicio 👇</p>';
    h+=`<button onclick="A.addW()" class="w-full py-3 border-2 border-dashed border-slate-600 rounded-xl text-slate-300 font-semibold">＋ Añadir ejercicio a ${sel}</button>`;
  }
  if(tab==='m'){
    const list=D.m[sel]||[],pr=pM(sv.m,today),pct=Math.min(100,pr/GOAL*100);

    h+=`<p class="text-xs text-slate-400 mb-2">${sel}: ${pM(D.m,sel)} g proteína · ${kM(D.m,sel)} kcal (borrador)</p>`;
    h+=list.map(x=>`<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-3 flex items-center gap-3"><button onclick="A.ckM('${x.id}')" class="cb ${x.c?'on':''}">✓</button><div class="flex-grow min-w-0"><p class="text-[11px] uppercase text-slate-500">${esc(x.t)}</p><p class="font-semibold truncate">${esc(x.d)}</p><p class="text-xs"><span class="text-lime-400">${x.p} g prot</span> · <span class="text-slate-400">${x.k} kcal</span></p></div><button class="ib" onclick="A.editM('${x.id}')">✏️</button><button class="ib" onclick="A.del('m','${x.id}')">🗑</button></div>`).join('')||'<p class="text-center text-slate-500 py-8">Sin comidas.</p>';
    h+=`<button onclick="A.addM()" class="w-full py-3 border-2 border-dashed border-slate-600 rounded-xl text-slate-300 font-semibold">＋ Añadir alimento a ${sel}</button>`;
  }
  if(tab==='s'){
    const tot=r=>D.sh.filter(r).reduce((a,x)=>a+x.q*x.u,0),T=tot(()=>1),B=tot(x=>x.b);
    h+=`<div class="grid grid-cols-3 gap-3 mb-4">${card('Estimado',money(T),'text-white')}${card('Comprado',money(B),'text-lime-400')}${card('Pendiente',money(T-B),'text-orange-400')}</div>`;
    const cats=[...new Set([...CATS,...D.sh.map(x=>x.cat)])].filter(c=>D.sh.some(x=>x.cat===c));
    const fr=D.sh.filter(x=>x.o&&x.o!=='Comprado').length;h+=fr?`<p class="text-xs text-lime-400 mb-3">🌱 ${fr} producto(s) gratis (canchón, regalo o donado): no suman al gasto.</p>`:'';
    h+=`<div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4"><b class="text-sm">Gasto por categoría</b>${cats.map(c=>{const v=tot(x=>x.cat===c);return `<div class="mt-2"><div class="flex justify-between text-xs"><span>${esc(c)}</span><span>${money(v)}</span></div><div class="h-2 bg-slate-900 rounded-full"><div class="h-2 bg-orange-400 rounded-full" style="width:${T?v/T*100:0}%"></div></div></div>`}).join('')||'<p class="text-xs text-slate-500 mt-1">Sin datos</p>'}</div>`;
    h+=cats.map(c=>`<h3 class="text-xs uppercase text-slate-400 font-bold mt-4 mb-2">${esc(c)}</h3>`+D.sh.filter(x=>x.cat===c).map(x=>`<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-2 flex items-center gap-3"><button onclick="A.ckS('${x.id}')" class="cb ${x.b?'on':''}">✓</button><div class="flex-grow min-w-0"><p class="font-semibold truncate ${x.b?'line-through text-slate-500':''}">${esc(x.n)}</p><p class="text-xs text-slate-400">${x.q} ${esc(x.un)} ${x.o&&x.o!=='Comprado'?`· <b class="text-lime-400">🌱 ${esc(x.o)} · gratis</b>`:`× ${money(x.u)} = <b class="text-white">${money(x.q*x.u)}</b>`}</p></div><button class="ib" onclick="A.editS('${x.id}')">✏️</button><button class="ib" onclick="A.del('s','${x.id}')">🗑</button></div>`).join('')).join('');
    h+=`<button onclick="A.addS()" class="mt-4 w-full py-3 border-2 border-dashed border-slate-600 rounded-xl text-slate-300 font-semibold">＋ Añadir producto</button>`;
  }
  if(tab==='r')h=rHTML();
  if(tab==='p')h=wHTML();
  if(tab==='h')h=hHTML();
  $('app').innerHTML=h;
  const d=dirty();$('dirty').classList.toggle('hidden',!d);$('saveBtn').className='font-bold text-sm px-4 py-2 rounded-lg '+(d?'bg-lime-500 text-slate-900 animate-pulse':'bg-slate-700 text-slate-400');
}
const wk=()=>Object.keys(D.pw).sort();
function wHTML(){const ks=wk(),k=key(),cur=ks.length?D.pw[ks[ks.length-1]]:0,g=D.g,st=g.start||(ks.length?D.pw[ks[0]]:0),id=g.ideal;
 let pct=0,msg='Define tu peso ideal para ver tu progreso.';
 if(id&&st&&cur&&st!==id){pct=Math.max(0,Math.min(100,(st-cur)/(st-id)*100));const rem=cur-id;msg=Math.abs(rem)<0.05?'¡Llegaste a tu peso ideal! 🎯':(rem>0?'Te faltan '+rem.toFixed(1)+' kg por bajar':'Te faltan '+(-rem).toFixed(1)+' kg por subir')}
 let h=D.pw[k]?'':'<div class="bg-amber-900/40 border border-amber-500 text-amber-200 text-sm rounded-xl p-3 mb-4">⏰ Aún no registras tu peso de hoy (pésate a las 6:00 am).</div>';
 h+=`<div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4"><b class="text-sm">Registrar peso</b><div class="grid grid-cols-5 gap-2 mt-2"><input type="date" id="wd" value="${k}" max="${k}" class="col-span-2"><input type="number" id="wv" step="0.1" min="20" max="300" inputmode="decimal" placeholder="kg" class="col-span-2"><button onclick="A.addP()" class="bg-lime-500 text-slate-900 font-bold rounded-lg">OK</button></div><p id="we" class="text-red-400 text-xs mt-1 min-h-4"></p></div>`;
 h+=`<div class="grid grid-cols-3 gap-3 mb-3">${card('Actual',cur?cur+' kg':'—','text-white')}${card('Ideal',id?id+' kg':'—','text-lime-400')}${card('Inicial',st?st+' kg':'—','text-slate-300')}</div>`;
 h+=`<div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4"><div class="flex justify-between text-sm mb-2"><b>🎯 Progreso hacia tu meta</b><span class="text-lime-400 font-bold">${pct.toFixed(0)}%</span></div><div class="h-3 bg-slate-900 rounded-full overflow-hidden"><div class="h-3 bg-lime-500 rounded-full" style="width:${pct}%"></div></div><p class="text-xs text-slate-400 mt-2">${msg}</p><button onclick="A.goal()" class="ib mt-3">✏️ Editar meta</button></div>`;
 const pts=ks.slice(-30).map(x=>[x,D.pw[x]]);
 if(pts.length>1){const v=pts.map(p=>p[1]).concat(id?[id]:[]),mn=Math.min(...v)-0.5,mx=Math.max(...v)+0.5,X=i=>10+i*(280/(pts.length-1)),Y=y=>110-(y-mn)/(mx-mn)*100;
  h+=`<div class="bg-slate-800 border border-slate-700 rounded-xl p-3 mb-4"><svg viewBox="0 0 300 120" class="w-full">${id?`<line x1="10" x2="290" y1="${Y(id)}" y2="${Y(id)}" stroke="#84cc16" stroke-dasharray="4"/>`:''}<polyline fill="none" stroke="#fb923c" stroke-width="2" points="${pts.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="2.5" fill="#fb923c"/>`).join('')}</svg><p class="text-[11px] text-slate-500 text-center">Últimos ${pts.length} registros · línea verde = peso ideal</p></div>`}
 h+=`<table class="w-full text-sm"><thead class="text-xs text-slate-400"><tr><th class="text-left p-2">Fecha</th><th class="p-2">Peso</th><th class="p-2">Cambio</th><th></th></tr></thead><tbody>${ks.slice().reverse().map(x=>{const i=ks.indexOf(x),d=i?D.pw[x]-D.pw[ks[i-1]]:0;return `<tr class="border-t border-slate-800"><td class="p-2">${dn(x).slice(0,3)} ${show(x)}</td><td class="p-2 text-center font-semibold">${D.pw[x]} kg</td><td class="p-2 text-center ${d>0?'text-orange-400':d<0?'text-lime-400':'text-slate-500'}">${i?(d>0?'+':'')+d.toFixed(1):'—'}</td><td><button class="ib" onclick="A.delP('${x}')">🗑</button></td></tr>`}).join('')||'<tr><td colspan="4" class="p-4 text-center text-slate-500">Sin registros</td></tr>'}</tbody></table>`;return h}
function rHTML(){const sv=SV(),k=key(),ks=Object.keys(sv.pw).sort(),g=sv.g,ymd=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
 const days=[];for(let i=13;i>=0;i--){const t=new Date(k+'T12:00:00');t.setDate(t.getDate()-i);days.push(ymd(t))}
 const rec=days.filter(d=>sv.h[d]),av=f=>rec.length?Math.round(rec.reduce((a,d)=>a+f(sv.h[d]),0)/rec.length):0,pOK=rec.filter(d=>sv.h[d].p>=GOAL).length;
 let streak=0,t=new Date(k+'T12:00:00');if(!sv.h[k])t.setDate(t.getDate()-1);while(sv.h[ymd(t)]){streak++;t.setDate(t.getDate()-1)}
 let tot=0,dn_=0;DAYS.forEach(d=>sv.w[d].forEach(x=>{tot+=x.c.length;dn_+=x.c.filter(Boolean).length}));const wp=tot?Math.round(dn_/tot*100):0;
 const cur=ks.length?sv.pw[ks[ks.length-1]]:0,st=g.start||(ks.length?sv.pw[ks[0]]:0),id=g.ideal,ch=cur&&st?cur-st:0;
 let pct=0,msg='Registra tu peso y define tu peso ideal en la pestaña ⚖️ Peso.';
 if(id&&st&&cur&&st!==id){pct=Math.max(0,Math.min(100,(st-cur)/(st-id)*100));const toward=(id<st)?ch<0:ch>0;msg=Math.abs(cur-id)<0.05?'¡Meta cumplida! 🎯':(ch===0?'Aún sin cambio desde el inicio. ¡Constancia!':(toward?'Vas en la dirección correcta 💪':'Te alejaste un poco de la meta. Ajusta y sigue.'))+' Faltan '+Math.abs(cur-id).toFixed(1)+' kg.'}
 const mx=Math.max(1,...days.map(d=>Math.max(sv.h[d]?.kb||0,sv.h[d]?.kc||0)));
 const bars=days.map((d,i)=>{const r=sv.h[d]||{kb:0,kc:0},x=i*21+4,H=v=>v/mx*90;return `<rect x="${x}" y="${100-H(r.kc)}" width="8" height="${H(r.kc)}" fill="#64748b"/><rect x="${x+9}" y="${100-H(r.kb)}" width="8" height="${H(r.kb)}" fill="#fb923c"/><text x="${x+9}" y="112" font-size="7" fill="#94a3b8" text-anchor="middle">${d.slice(8)}</text>`}).join('');
 return `<div class="bg-slate-800 border border-slate-700 rounded-xl p-4 mb-4"><div class="flex justify-between text-sm mb-2"><b>🎯 Tu meta de peso</b><span class="text-lime-400 font-bold">${pct.toFixed(0)}%</span></div><div class="h-3 bg-slate-900 rounded-full overflow-hidden"><div class="h-3 bg-lime-500 rounded-full" style="width:${pct}%"></div></div><p class="text-xs text-slate-400 mt-2">${msg}</p></div>
 <div class="grid grid-cols-3 gap-3 mb-3">${card('Peso actual',cur?cur+' kg':'—','text-white')}${card('Cambio total',cur&&st?(ch>0?'+':'')+ch.toFixed(1)+' kg':'—',ch<=0?'text-lime-400':'text-orange-400')}${card('Racha',streak+' día(s)','text-lime-400')}</div>
 <div class="grid grid-cols-3 gap-3 mb-4">${card('Series semana',wp+'%','text-orange-400')}${card('Meta proteína',pOK+'/'+rec.length+' días','text-lime-400')}${card('Prom. proteína',av(r=>r.p)+' g','text-white')}</div>
 <div class="bg-slate-800 border border-slate-700 rounded-xl p-3"><b class="text-sm">Últimos 14 días</b><svg viewBox="0 0 300 116" class="w-full mt-2">${bars}</svg><p class="text-[11px] text-slate-400 text-center"><span style="color:#fb923c">■</span> quemadas (prom. ${av(r=>r.kb)} kcal) · <span style="color:#64748b">■</span> consumidas (prom. ${av(r=>r.kc)} kcal)</p></div>
 <p class="text-xs text-slate-500 mt-3">Se calcula con lo que guardaste (💾). Días con registro en los últimos 14: ${rec.length}.</p>`}
function hHTML(){const sv=SV(),ks=[...new Set([...Object.keys(sv.h),...Object.keys(sv.pw)])].sort().reverse();
 const rows=ks.map(k=>{const r=sv.h[k],b=r?r.kc-r.kb:null;return `<tr class="border-t border-slate-800"><td class="p-2 whitespace-nowrap">${dn(k).slice(0,3)} ${show(k)}</td><td class="p-2 text-center">${sv.pw[k]?sv.pw[k]+' kg':'—'}</td><td class="p-2 text-center text-orange-400">${r?r.kb:'—'}</td><td class="p-2 text-center">${r?r.kc:'—'}</td><td class="p-2 text-center ${b>0?'text-orange-400':'text-lime-400'}">${r?(b>0?'+':'')+b:'—'}</td><td class="p-2 text-center text-lime-400">${r?r.p+' g':'—'}</td></tr>`}).join('');
 return `<p class="text-xs text-slate-400 mb-3">Se guarda un resumen del día cada vez que pulsas 💾 Guardar. Fechas con calendario de Perú (America/Lima). Balance = kcal consumidas − quemadas.</p><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs text-slate-400"><tr><th class="text-left p-2">Fecha</th><th class="p-2">Peso</th><th class="p-2">Quemadas</th><th class="p-2">Consumidas</th><th class="p-2">Balance</th><th class="p-2">Proteína</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="p-6 text-center text-slate-500">Aún no hay historial. Marca tus checks y pulsa Guardar.</td></tr>'}</tbody></table></div>`}
function setSt(t){$('st').textContent=t}
function push(){if(docRef)setDoc(docRef,{json:saved,updated:Date.now()}).then(()=>setSt('☁️ Sincronizado')).catch(e=>setSt('⚠️ Error nube'))}
async function initFB(){if(!CFG){setSt('💾 Local');return}
 try{const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app);
  if(typeof __initial_auth_token!=='undefined')await signInWithCustomToken(auth,__initial_auth_token);else await signInAnonymously(auth);
  onAuthStateChanged(auth,u=>{if(!u)return;docRef=doc(db,'artifacts',APPID,'users',u.uid,'appState','mainData');
   onSnapshot(docRef,sn=>{if(sn.exists()){const j=sn.data().json;if(j&&j!==saved&&!dirty()){try{D=norm(JSON.parse(j));saved=JSON.stringify(D);render()}catch(e){}}setSt('☁️ Sincronizado')}else push()},()=>setSt('⚠️ Sin conexión'))})
 }catch(e){setSt('⚠️ Firebase: '+String(e.message).slice(0,30))}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function form(title,fields,vals,ok){cfg={fields,ok};$('mt').textContent=title;$('me').textContent='';
  $('mb').innerHTML=fields.map(f=>`<label class="block text-xs text-slate-400">${f.l}${f.t==='select'?`<select name="${f.k}">${f.o.map(o=>`<option ${o===vals[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t}" ${f.t==='number'?'step="any" min="0" inputmode="decimal"':''} value="${esc(vals[f.k]??'')}">`}</label>`).join('');
  $('modal').classList.remove('hidden')}
const find=(arr,id)=>arr.find(x=>x.id===id);
const A={
 tab(t){tab=t;render()},day(d){sel=d;render()},close(){$('modal').classList.add('hidden')},
 submit(e){e.preventDefault();const v={};for(const f of cfg.fields){let x=new FormData($('mf')).get(f.k);x=(x||'').trim();
   if(f.t==='number'){x=x===''?0:parseFloat(x);if(isNaN(x)||x<0){$('me').textContent=f.l+': número válido (≥ 0)';return false}}
   else if(f.req&&!x){$('me').textContent='Falta: '+f.l;return false}v[f.k]=x}
   if(v.s!==undefined&&(v.s<1||v.s>12||v.s%1)){$('me').textContent='Series: entero entre 1 y 12';return false}
   cfg.ok(v);A.close();render();return false},
 ck(id,i){const x=find(D.w[sel],id);x.c[i]=!x.c[i];render()},
 ckM(id){const x=find(D.m[sel],id);x.c=!x.c;render()},
 ckS(id){const x=find(D.sh,id);x.b=!x.b;render()},
 addW(){form('Nuevo ejercicio · '+sel,[{k:'n',l:'Nombre',t:'text',req:1},{k:'s',l:'Series',t:'number'},{k:'k',l:'kcal por serie',t:'number'}],{s:3,k:15},v=>D.w[sel].push(W(v.n,v.s||1,v.k)))},
 editW(id){const x=find(D.w[sel],id);form('Editar ejercicio',[{k:'n',l:'Nombre',t:'text',req:1},{k:'s',l:'Series',t:'number'},{k:'k',l:'kcal por serie',t:'number'}],x,v=>{x.n=v.n;x.k=v.k;const s=v.s||1;x.c=Array.from({length:s},(_,i)=>x.c[i]||false);x.s=s})},
 addM(){form('Nuevo alimento · '+sel,[{k:'t',l:'Comida',t:'select',o:['Desayuno','Almuerzo','Cena','Snack','Extra']},{k:'d',l:'Descripción',t:'text',req:1},{k:'p',l:'Proteína (g)',t:'number'},{k:'k',l:'Calorías (kcal)',t:'number'}],{t:'Snack'},v=>D.m[sel].push(M(v.t,v.d,v.p,v.k)))},
 editM(id){const x=find(D.m[sel],id);form('Editar alimento',[{k:'t',l:'Comida',t:'select',o:['Desayuno','Almuerzo','Cena','Snack','Extra']},{k:'d',l:'Descripción',t:'text',req:1},{k:'p',l:'Proteína (g)',t:'number'},{k:'k',l:'Calorías (kcal)',t:'number'}],x,v=>Object.assign(x,v))},
 addS(){form('Nuevo producto',[{k:'n',l:'Producto',t:'text',req:1},{k:'cat',l:'Categoría',t:'select',o:CATS},{k:'o',l:'Origen (si no es comprado, no lleva precio)',t:'select',o:ORIG},{k:'q',l:'Cantidad',t:'number'},{k:'un',l:'Unidad (kg, und...)',t:'text'},{k:'u',l:'Precio por unidad (S/)',t:'number'}],{q:1,un:'und',o:'Comprado'},v=>{if(v.o!=='Comprado')v.u=0;D.sh.push({id:uid(),b:false,...v})})},
 editS(id){const x=find(D.sh,id);form('Editar producto',[{k:'n',l:'Producto',t:'text',req:1},{k:'cat',l:'Categoría',t:'select',o:[...new Set([...CATS,x.cat])]},{k:'o',l:'Origen (si no es comprado, no lleva precio)',t:'select',o:ORIG},{k:'q',l:'Cantidad',t:'number'},{k:'un',l:'Unidad',t:'text'},{k:'u',l:'Precio por unidad (S/)',t:'number'}],x,v=>{if(v.o!=='Comprado')v.u=0;Object.assign(x,v)})},
 del(t,id){if(!confirm('¿Eliminar este elemento?'))return;if(t==='s')D.sh=D.sh.filter(x=>x.id!==id);else D[t][sel]=D[t][sel].filter(x=>x.id!==id);render()},
 save(){const k=key(),d=dn(k);D.h[k]={kb:kW(D.w,d),kc:kM(D.m,d),p:pM(D.m,d)};const s=JSON.stringify(D);try{localStorage.setItem(KEY,s)}catch(e){toast('⚠️ No se pudo guardar localmente. Usa Exportar.')}saved=s;push();render();toast('✅ Guardado')},
 addP(){const d=$('wd').value,v=parseFloat($('wv').value);if(!d||d>key()){$('we').textContent='Fecha inválida (no futura)';return}if(isNaN(v)||v<20||v>300){$('we').textContent='Peso válido: 20–300 kg';return}D.pw[d]=Math.round(v*10)/10;A.save()},
 delP(k){if(confirm('¿Eliminar el peso del '+show(k)+'?')){delete D.pw[k];A.save()}},
 goal(){form('Meta de peso',[{k:'ideal',l:'Peso ideal (kg)',t:'number'},{k:'start',l:'Peso inicial (kg, 0 = primer registro)',t:'number'}],D.g,v=>{D.g={ideal:v.ideal,start:v.start};A.save()})},
 menu(){const o=prompt('1 = Reiniciar checks de la semana\n2 = Exportar copia (JSON)\n3 = Importar copia\n4 = Restaurar datos originales');
  if(o==='1'){if(confirm('¿Desmarcar todos los checks de la semana?')){DAYS.forEach(d=>{D.w[d].forEach(x=>x.c=x.c.map(()=>false));D.m[d].forEach(x=>x.c=false)});D.sh.forEach(x=>x.b=false);render()}}
  if(o==='2'){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(D));a.download='walifit-backup.json';a.click()}
  if(o==='3')$('imp').click();
  if(o==='4'&&confirm('Se perderán tus cambios. ¿Continuar?')){D=def();render()}}
};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.w||!j.m||!j.sh)throw 0;D=j;render();toast('Importado: pulsa Guardar')}catch(x){alert('Archivo no válido')}};r.readAsText(f);e.target.value=''};
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
window.A=A;
render();
initFB();
</script>
