<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WaliFit</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#f8fafc;-webkit-tap-highlight-color:transparent}
.cb{width:30px;height:30px;border:2px solid #475569;border-radius:8px;background:#1e293b;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.15s;flex-shrink:0}
.cb.on{background:#84cc16;border-color:#84cc16;color:#0f172a;font-weight:700}
.ib{padding:6px 10px;border-radius:8px;font-size:14px;background:#1e293b;border:1px solid #334155;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{border-color:#84cc16}
.ib.sm{padding:4px 6px;min-height:32px;font-size:12px}
input,select{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;width:100%;color:#fff;outline:none;font-size:16px}
@media(min-width:640px){input,select{font-size:14px;padding:8px}}
input:focus,select:focus{border-color:#84cc16}
.xa{position:relative;width:80px;height:80px;border-radius:12px;overflow:hidden;background:#0f172a;border:1px solid #334155;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.xa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.xa img+img{animation:fl 1.4s steps(1) infinite}
@keyframes fl{0%{opacity:1}50%{opacity:0}}
.ni{font-style:normal}
.tab-btn{flex:1 0 auto;min-width:52px;padding:10px 8px;font-size:13px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;color:#94a3b8;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-btn.active{border-color:#84cc16;color:#a3e635}
@media(min-width:640px){.tab-btn{flex:1;min-width:0;font-size:14px;flex-direction:row;gap:4px}}
</style>
</head>
<body class="min-h-screen pb-24">
<header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800">
  <div class="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between gap-2">
    <div class="min-w-0"><h1 class="text-lg sm:text-xl font-bold leading-tight">⚡ Wali<span class="text-lime-500">Fit</span></h1><p id="st" class="text-[10px] text-slate-400 leading-none truncate max-w-[40vw]"></p></div>
    <div class="flex items-center gap-1.5 sm:gap-2">
      <span id="dirty" class="hidden text-[10px] sm:text-xs text-amber-400">● Sin guardar</span>
      <button onclick="A.acct()" id="acct" class="ib whitespace-nowrap">🔐<span class="hidden sm:inline"> Google</span></button>
      <button onclick="A.save()" id="saveBtn" class="bg-lime-500 text-slate-900 font-bold text-sm px-3 sm:px-4 py-2 rounded-lg">💾<span class="hidden sm:inline"> Guardar</span></button>
      <button onclick="A.menu()" class="ib">⋯</button>
    </div>
  </div>
  <nav class="max-w-3xl mx-auto px-1 sm:px-4 flex overflow-x-auto" id="tabs"></nav>
</header>
<main class="max-w-3xl mx-auto px-3 sm:px-4 py-4 sm:py-5" id="app"></main>

<div id="pm" class="hidden fixed inset-0 z-50 bg-slate-900/80 flex items-end sm:items-center justify-center p-4"><div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
 <div class="flex justify-between mb-2"><h3 id="pmt" class="font-bold"></h3><button class="ib" onclick="A.xclose()">✕</button></div>
 <div id="pmi" class="xa mx-auto" style="width:min(220px,80vw);height:min(220px,80vw)"></div>
 <p class="text-[11px] text-slate-500 text-center mt-1">La imagen alterna entre el inicio y el final del movimiento.</p>
 <label class="block text-xs text-slate-400 mt-3">Cambiar imagen · buscar en el catálogo<input id="pmq" oninput="A.xs()" placeholder="sentadilla, press banca, curl..." autocomplete="off"></label>
 <div id="pmr" class="mt-2 max-h-48 overflow-y-auto space-y-1"></div>
 <label class="block text-xs text-slate-400 mt-3">O pega la URL de tu propio GIF o imagen<input id="pmu" placeholder="https://..."></label>
 <div class="flex gap-2 mt-2"><button type="button" onclick="A.xurl()" class="flex-1 py-2 rounded-lg border border-slate-600 text-sm">Usar URL</button><button type="button" onclick="A.xdel()" class="flex-1 py-2 rounded-lg border border-slate-600 text-sm">Quitar imagen</button></div>
 <p id="pme" class="text-red-400 text-xs mt-1 min-h-4"></p></div></div>
<div id="fm" class="hidden fixed inset-0 z-50 bg-slate-900/80 flex items-end sm:items-center justify-center p-4"><div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
 <h3 class="font-bold mb-1" id="fmt">Añadir alimento</h3><p id="fh" class="hidden text-xs text-slate-400 mb-2">Elige otro alimento de la lista para reemplazar este, o solo cambia el momento.</p>
 <label class="block text-xs text-slate-400">Momento<select id="fs"></select></label>
 <label class="block text-xs text-slate-400 mt-3">Buscar en tu base de alimentos<input id="fq" placeholder="huevo, avena, café..." oninput="A.fsearch()" autocomplete="off"></label>
 <div id="fr" class="mt-2 max-h-44 overflow-y-auto space-y-1"></div>
 <div class="grid grid-cols-2 gap-3 mt-3 items-end"><label class="block text-xs text-slate-400">Cantidad (porciones)<input id="fn" type="number" step="0.5" min="0.25" value="1" oninput="A.fprev()"></label><p id="fp" class="text-xs text-lime-400"></p></div>
 <p id="fe" class="text-red-400 text-xs mt-2 min-h-4"></p>
 <button type="button" onclick="A.fman()" class="text-xs text-slate-400 underline mb-3">✍️ Ingresar manualmente</button>
 <div class="flex gap-3"><button type="button" onclick="A.fclose()" class="flex-1 py-2 rounded-lg border border-slate-600">Cancelar</button><button type="button" onclick="A.fok()" id="fb" class="flex-1 py-2 rounded-lg bg-lime-500 text-slate-900 font-bold">Añadir</button></div></div></div>
<div id="bm" class="hidden fixed inset-0 z-50 bg-slate-900/80 flex items-end sm:items-center justify-center p-4"><div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto">
 <div class="flex justify-between mb-3"><h3 class="font-bold">📚 Base de alimentos</h3><button class="ib" onclick="A.bclose()">✕</button></div>
 <input id="bq" placeholder="Buscar..." oninput="A.bl()" class="mb-3"><div id="bl" class="space-y-2"></div>
 <button onclick="A.newF('')" class="mt-3 w-full py-2 rounded-lg bg-lime-500 text-slate-900 font-bold">＋ Nuevo alimento o plato</button></div></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/80 flex items-end sm:items-center justify-center p-4">
  <form id="mf" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 w-full max-w-sm max-h-[90vh] overflow-y-auto" onsubmit="return A.submit(event)">
    <h3 id="mt" class="font-bold mb-3"></h3><div id="mb" class="space-y-3"></div>
    <p id="me" class="text-red-400 text-xs mt-2 min-h-4"></p>
    <div class="flex gap-3 mt-3"><button type="button" onclick="A.close()" class="flex-1 py-2 rounded-lg border border-slate-600">Cancelar</button><button class="flex-1 py-2 rounded-lg bg-lime-500 text-slate-900 font-bold">Aceptar</button></div>
  </form>
</div>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-lime-500 text-slate-900 font-semibold text-sm px-4 py-2 rounded-full z-50"></div>
<input type="file" id="imp" accept=".json" class="hidden">

async function initFB(){
  if(!CFG){setSt('💾 Local');$('acct').classList.add('hidden');return}
  try{
    const app=initializeApp(CFG);auth=getAuth(app);db=getFirestore(app);
    try { await setPersistence(auth, browserLocalPersistence); } catch(e){ console.warn('persistencia', e); }

    onAuthStateChanged(auth, async u=>{
      if(!u){
        try{
          if(typeof __initial_auth_token!=='undefined') await signInWithCustomToken(auth,__initial_auth_token);
          else await signInAnonymously(auth);
        }catch(e){setSt('⚠️ '+String(e.code||e.message).slice(0,28))}
        return
      }
      acct(u);
      docRef=doc(db,'artifacts',APPID,'users',u.uid,'appState','mainData');
      if(unsub)unsub();
      unsub=onSnapshot(docRef,sn=>{
        if(!sn.exists()){pend=null;push();return}
        const j=sn.data().json;
        if(pend!==null){
          const loc=pend;pend=null;
          if(j&&j!==loc){
            let a=0,b=0;try{a=sc(loc);b=sc(j)}catch(e){}
            const keep=a>0&&b===0?true:(a===0?false:confirm('Hay datos distintos:\n• Este dispositivo: '+a+' registro(s)\n• Tu cuenta de Google: '+b+' registro(s)\n\nAceptar = conservar los de ESTE dispositivo (reemplaza los de la cuenta)\nCancelar = conservar los de tu CUENTA (los de este dispositivo quedan como respaldo)'));
            if(keep){D=norm(JSON.parse(loc));saved=JSON.stringify(D);try{localStorage.setItem(KEY,saved)}catch(e){}push();render();toast('✅ Se conservaron los datos de este dispositivo')}
            else{useCloud(j);toast('✅ Se cargaron los datos de tu cuenta')}
          }
          setSt('☁️ Sincronizado');return
        }
        if(j&&j!==saved&&!dirty()){try{useCloud(j)}catch(e){}}
        setSt('☁️ Sincronizado')
      },()=>setSt('⚠️ Sin conexión'));
      render();
    });

    if(!redirectHandled){
      redirectHandled = true;
      getRedirectResult(auth).then(async (result) => {
        if (result && result.user) {
          acct(result.user);
          if (result.operationType === 'link') push();
          render();
          toast('✅ Sesión de Google activa');
        }
      }).catch((error) => {
        console.error('Redirect result error:', error);
        if (error.code && error.code !== 'auth/no-auth-event' && error.code !== 'auth/cancelled-popup-request') {
          setSt('⚠️ ' + String(error.code || error.message).slice(0, 28));
        }
      });
    }
  }catch(e){setSt('⚠️ Firebase: '+String(e.message).slice(0,30))}
}

 menu(){const o=prompt('1 = Reiniciar checks de la semana\n2 = Exportar copia (JSON)\n3 = Importar copia\n4 = Restaurar datos originales\n5 = Restaurar respaldo local (antes de cambiar de cuenta o cerrar sesión)');
  if(o==='1'){if(confirm('¿Desmarcar todos los checks (ejercicios, comidas y compras)?')){Object.keys(D.dw).forEach(d=>D.dw[d].forEach(x=>x.c=x.c.map(()=>false)));Object.keys(D.dm).forEach(d=>D.dm[d].forEach(x=>x.c=false));D.sh.forEach(x=>x.b=false);render()}}
  if(o==='2'){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(D));a.download='walifit-backup.json';a.click()}
  if(o==='3')$('imp').click();
  if(o==='4'&&confirm('Se perderán tus cambios. ¿Continuar?')){D=norm(def());render()}
  if(o==='5'){let b=null;try{b=localStorage.getItem(KEY+'_bak')}catch(e){}if(!b)alert('No hay respaldo local en este dispositivo.');else if(confirm('Se cargará el respaldo ('+sc(b)+' registro(s)) y reemplazará lo actual. Después pulsa Guardar para subirlo a tu cuenta. ¿Continuar?')){try{D=norm(JSON.parse(b));render();toast('Respaldo cargado: pulsa 💾 Guardar')}catch(e){alert('El respaldo está dañado')}}}}
};
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.w||!j.m||!j.sh)throw 0;D=norm(j);render();toast('Importado: pulsa Guardar')}catch(x){alert('Archivo no válido')}};r.readAsText(f);e.target.value=''};
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
window.A=A;
render();
initFB();
</script>
